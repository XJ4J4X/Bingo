<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Présentation - Le Bingo du Manoir</title>
    <link rel="icon" type="image/png" href="favicon.png?v=800">
    <link rel="stylesheet" href="style.css?v=5600">
</head>
<body class="player-page">
    <header>
        <h1>
            <img src="favicon.png?v=800" alt="Logo Aminato" class="title-logo" style="height:45px;width:45px;border-radius:50%;margin-right:15px;vertical-align:middle;box-shadow:0 4px 10px rgba(0,0,0,0.3);">
            Le Bingo du Manoir
            <img src="didier.png?v=800" alt="Didier" style="transform: scaleX(-1); height:55px; margin-left:-15px; vertical-align:middle; object-fit:contain; object-position:top right;">
        </h1>

        <div id="user-info" class="hidden">
            Mode Présentation (<span id="validated-counter">0/16</span>)
            <button id="logout-btn">Déconnexion</button>
        </div>
        <button id="theme-toggle" title="Basculer le thème">🌙</button>
    </header>

    <main>
        <section id="auth-section" class="hidden">
            <div class="auth-box">
                <h2>Validation Présentation</h2>
                <p>Entrez le mot de passe pour cocher les cases affichées sur le live.</p>

                <form id="auth-form">
                    <div class="input-group">
                        <input type="password" id="admin-password" placeholder="Mot de passe" required />
                    </div>
                    <div class="auth-buttons">
                        <button type="submit" id="login-btn">Se connecter</button>
                    </div>
                </form>

                <div id="auth-message"></div>
            </div>
        </section>

        <section id="control-panel" class="hidden">
            <div class="game-header" style="flex-wrap: wrap; gap: 10px;">
                <h2>Grille du Live</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button id="btn-toggle-visibility">Masquer le Bingo</button>
                    <button id="btn-reset-all">Tout décocher</button>
                </div>
            </div>

            <div id="bingo-grid" class="grid">
                <!-- 16 .bingo-cell générées dynamiquement -->
            </div>

            <div id="game-message" style="color: #27ae60;"></div>
        </section>
    </main>

    <div style="text-align: center; padding: 20px; font-size: 0.9em; color: #7f8c8d; margin-top: 40px; border-top: 1px solid rgba(0,0,0,0.1);">
        Fait avec amour par J4X ❤️ - Version 2.6.0
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let adminKey = urlParams.get('key') || localStorage.getItem('aminato_admin_key') || localStorage.getItem('adminToken') || "";

        const authSection = document.getElementById('auth-section');
        const controlPanel = document.getElementById('control-panel');
        const userInfo = document.getElementById('user-info');
        const authForm = document.getElementById('auth-form');
        const passwordInput = document.getElementById('admin-password');
        const authMessage = document.getElementById('auth-message');
        const gameMessage = document.getElementById('game-message');
        const cardsGrid = document.getElementById('bingo-grid');
        const counterEl = document.getElementById('validated-counter');
        const btnToggleVisibility = document.getElementById('btn-toggle-visibility');
        const btnResetAll = document.getElementById('btn-reset-all');
        const btnLogout = document.getElementById('logout-btn');
        const themeToggle = document.getElementById('theme-toggle');

        let currentPhrasesKey = "";
        let currentTicked = [];
        let currentVisible = true;
        let isProcessing = false;
        let msgTimeout = null;

        // Thème sombre identique au site principal
        if (localStorage.getItem('darkMode') === 'enabled') {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('darkMode', 'enabled');
                themeToggle.textContent = '☀️';
            } else {
                localStorage.setItem('darkMode', 'disabled');
                themeToggle.textContent = '🌙';
            }
        });

        function showStatus(text, isError = false) {
            if (!gameMessage) return;
            gameMessage.style.color = isError ? '#e74c3c' : '#27ae60';
            gameMessage.textContent = text;
            clearTimeout(msgTimeout);
            msgTimeout = setTimeout(() => {
                gameMessage.textContent = "";
            }, 2000);
        }

        async function verifyKey(key) {
            try {
                const res = await fetch('/api/presentation/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: key, phrase: "__CHECK__" })
                });
                return res.status !== 401;
            } catch (e) {
                return false;
            }
        }

        async function init() {
            if (adminKey) {
                const ok = await verifyKey(adminKey);
                if (ok) {
                    showPanel();
                    return;
                } else {
                    localStorage.removeItem('aminato_admin_key');
                    adminKey = "";
                }
            }
            showLogin();
        }

        function showLogin() {
            controlPanel.classList.add('hidden');
            userInfo.classList.add('hidden');
            authSection.classList.remove('hidden');
            passwordInput.value = "";
            authMessage.textContent = "";
        }

        function showPanel() {
            authSection.classList.add('hidden');
            controlPanel.classList.remove('hidden');
            userInfo.classList.remove('hidden');
            sync();
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd = passwordInput.value.trim();
            if (!pwd) return;

            authMessage.style.color = '#3498db';
            authMessage.textContent = "Vérification...";
            const ok = await verifyKey(pwd);
            if (ok) {
                adminKey = pwd;
                localStorage.setItem('aminato_admin_key', pwd);
                showPanel();
            } else {
                authMessage.style.color = '#e74c3c';
                authMessage.textContent = "Mot de passe incorrect.";
            }
        });

        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('aminato_admin_key');
            adminKey = "";
            showLogin();
        });

        function updateVisibilityButton() {
            if (!btnToggleVisibility) return;
            if (currentVisible) {
                btnToggleVisibility.textContent = "Masquer le Bingo";
                btnToggleVisibility.style.backgroundColor = "";
            } else {
                btnToggleVisibility.textContent = "Afficher le Bingo";
                btnToggleVisibility.style.backgroundColor = "#27ae60";
            }
        }

        btnToggleVisibility.addEventListener('click', async () => {
            try {
                const res = await fetch('/api/presentation/visibility', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: adminKey, visible: !currentVisible })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    currentVisible = data.visible;
                    updateVisibilityButton();
                    showStatus(currentVisible ? "Bingo affiché sur le live." : "Bingo masqué sur le live.");
                } else if (res.status === 401) {
                    showLogin();
                }
            } catch (e) {
                showStatus("Erreur de communication.", true);
            }
        });

        btnResetAll.addEventListener('click', async () => {
            if (!confirm("Décocher toutes les cases de la présentation ?")) return;
            try {
                const res = await fetch('/api/presentation/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: adminKey })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    currentTicked = [];
                    updateCards();
                    showStatus("Toutes les cases ont été décochées.");
                }
            } catch (e) {
                showStatus("Erreur de réinitialisation.", true);
            }
        });

        async function toggleTile(phrase, idx) {
            if (isProcessing) return;
            isProcessing = true;

            try {
                const res = await fetch('/api/presentation/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: adminKey, phrase: phrase, index: idx })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    currentTicked = data.ticked || [];
                    updateCards();
                } else if (res.status === 401) {
                    showLogin();
                } else {
                    showStatus(data.error || "Erreur de validation", true);
                }
            } catch (e) {
                showStatus("Erreur de communication.", true);
            } finally {
                isProcessing = false;
            }
        }

        function renderGrid(phrases) {
            cardsGrid.innerHTML = "";
            phrases.forEach((phrase, idx) => {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell';
                cell.dataset.phrase = phrase;
                cell.dataset.index = idx;

                if (currentTicked.includes(phrase)) {
                    cell.classList.add('checked');
                }

                cell.textContent = phrase;
                cell.addEventListener('click', () => toggleTile(phrase, idx));
                cardsGrid.appendChild(cell);
            });
        }

        function updateCards() {
            if (counterEl) counterEl.textContent = `${currentTicked.length}/16`;
            const cells = cardsGrid.querySelectorAll('.bingo-cell');
            cells.forEach(cell => {
                const phrase = cell.dataset.phrase;
                if (currentTicked.includes(phrase)) {
                    cell.classList.add('checked');
                } else {
                    cell.classList.remove('checked');
                }
            });
        }

        async function sync() {
            if (!adminKey) return;
            try {
                const res = await fetch('/api/presentation/state?t=' + Date.now());
                if (!res.ok) return;
                const data = await res.json();

                currentVisible = data.visible !== false;
                updateVisibilityButton();

                const phrases = data.phrases || [];
                const phrasesKey = phrases.join('||');

                if (phrasesKey !== currentPhrasesKey) {
                    currentPhrasesKey = phrasesKey;
                    currentTicked = data.ticked || [];
                    renderGrid(phrases);
                    updateCards();
                } else {
                    currentTicked = data.ticked || [];
                    updateCards();
                }
            } catch (e) {
                console.error("Erreur sync", e);
            }
        }

        init();
        setInterval(sync, 1500);
    </script>
</body>
</html>
