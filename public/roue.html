<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roue Aléatoire - AminatoBingo</title>
    <link rel="stylesheet" href="style.css?v=44">
    <link rel="stylesheet" href="roue.css?v=43">
    <link rel="icon" type="image/png" href="favicon.png?v=2">
</head>
<body>
    <button id="btn-toggle-menu" title="Afficher/Masquer le menu">☰</button>
    <div id="roue-container">
        <!-- Sidebar Controls -->
        <aside id="roue-sidebar" class="glass-panel">
            <h2 style="display:flex;align-items:center;"><img src="favicon.png" alt="Logo Roue" class="title-logo" style="height:35px;width:35px;margin-right:10px;">Configuration de la Roue<img src="didier.png?v=1" alt="Didier" style="transform: scaleX(-1); height:45px; margin-left:-15px; vertical-align:middle; object-fit:contain; object-position:top right;"></h2>
            
            <div class="control-group">
                <label>Profils de la Roue :</label>
                <div style="display:flex; gap: 5px; margin-bottom: 5px;">
                    <select id="wheel-profile-select" style="flex:1; padding: 5px; border-radius: 4px; background: rgba(255,255,255,0.1); color: inherit; border: 1px solid rgba(255,255,255,0.2);">
                        <option value="default" style="color:#000;">Défaut</option>
                    </select>
                    <button id="btn-save-profile" class="btn" style="padding: 5px 10px;" title="Sauvegarder ce profil">💾</button>
                    <button id="btn-delete-profile" class="btn danger-btn" style="padding: 5px 10px;" title="Supprimer ce profil">🗑️</button>
                </div>
            </div>

            <div class="control-group">
                <label for="phrases-input">Phrases (une par ligne) :</label>
                <textarea id="phrases-input" rows="10" placeholder="Entrez vos phrases ici...">Gage 1
VIP
Rien du tout
Chanson
Gage 2</textarea>
            </div>
            
            <div class="control-group">
                <button id="btn-update-wheel" class="btn primary">Mettre à jour la roue</button>
            </div>

            <div class="control-group toggle-group">
                <label for="green-screen-toggle">Mode Fond Vert (OBS)</label>
                <label class="switch">
                    <input type="checkbox" id="green-screen-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            
            <a href="index.html" class="back-link">← Retour au Bingo</a>
        </aside>

        <!-- Main Wheel Area -->
        <main id="roue-main">
            <div class="wheel-wrapper">
                <canvas id="wheel-canvas" width="600" height="600"></canvas>
                <div class="wheel-pointer"></div>
            </div>
            <button id="btn-spin" class="btn action-btn">TOURNER !</button>
            
            <!-- Winner Overlay -->
            <div id="winner-overlay" class="hidden">
                <div class="winner-content">
                    <div id="winner-text" class="winner-text"></div>
                    <button id="btn-close-winner" class="btn primary">Fermer</button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="roue.js?v=43"></script>
</body>
</html>
